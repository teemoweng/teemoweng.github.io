<style>
/* ════════ TOKENS ════════ */
:root {
  --cream: #faf3ea;
  --cream-2: #f6e8d7;
  --sky-1: #f7b98f;
  --sky-2: #f8e8d8;
  --peach: #f0a868;
  --peach-deep: #d9854a;
  --peach-soft: #f7c9a0;
  --ink: #3e3228;
  --ink-2: #7a6a58;
  --ink-3: #c4b29c;
  --dusk-1: #4a3a30;
  --dusk-2: #8a6a52;
  --radius: 16px;
  --font-sans: 'Hanken Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
html.motion { scroll-behavior: auto; } /* Lenis takes over */

body {
  font-family: var(--font-sans);
  background: var(--cream);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--peach); color: #fff; }

/* ════════ ATMOSPHERE: vignette + grain ════════ */
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 80;
  box-shadow: inset 0 0 18vmin 5vmin rgba(140, 80, 40, 0.14);
}
.grain {
  position: fixed; inset: -50%; width: 200%; height: 200%;
  pointer-events: none; z-index: 81; opacity: 0.05;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
html.motion .grain { animation: grain-shift 1.2s steps(4) infinite; }
@keyframes grain-shift {
  0% { transform: translate(0,0); } 25% { transform: translate(-2%,1%); }
  50% { transform: translate(1%,-2%); } 75% { transform: translate(-1%,2%); } 100% { transform: translate(0,0); }
}

/* ════════ NAV ════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 28px;
  pointer-events: none;
}
nav > * { pointer-events: auto; }
.nav-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 99px;
  background: rgba(255, 252, 246, 0.55);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.5);
  color: var(--ink-2); font-size: 13.5px; font-weight: 700;
  text-decoration: none; cursor: pointer; font-family: var(--font-sans);
  transition: color 0.25s, background 0.25s, transform 0.25s;
  box-shadow: 0 2px 14px rgba(150, 90, 40, 0.07);
}
.pill:hover { color: var(--peach-deep); background: rgba(255,252,246,0.85); transform: translateY(-1px); }
.pill-logo {
  padding: 10px 14px; border-radius: 14px;
  background: rgba(255,252,246,0.92);
  font-weight: 800; color: var(--peach-deep); font-size: 15px;
  letter-spacing: -0.02em;
}
.pill-logo:hover { transform: rotate(-4deg); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.pill-sm {
  padding: 9px 14px; font-size: 12.5px;
}
.lang-pill { display: inline-flex; border-radius: 99px; overflow: hidden;
  background: rgba(255,252,246,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 2px 14px rgba(150,90,40,0.07); }
.lang-pill button {
  padding: 9px 13px; border: none; background: transparent;
  font-family: var(--font-sans); font-size: 12px; font-weight: 800;
  color: var(--ink-3); cursor: pointer; transition: all 0.25s;
}
.lang-pill button.active { background: var(--peach-deep); color: #fff8f0; }

/* ════════ SCENE HELPERS ════════ */
.scene { position: relative; }
.kicker {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--peach-deep);
}
.scene-inner { max-width: 1280px; margin: 0 auto; padding: 0 6vw; }

/* ════════ SCENE 1: OPENING ════════ */
#s1 {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  background: linear-gradient(180deg, var(--sky-1) 0%, #f8cfa9 45%, var(--sky-2) 82%, var(--cream) 100%);
  overflow: hidden;
}
.s1-stage { position: relative; width: 100%; text-align: center; padding-bottom: 17vh; }
.s1-halo {
  position: absolute; left: 50%; bottom: -4vh; transform: translateX(-50%);
  width: 110vmin; height: 56vmin; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,244,228,0.85), rgba(255,232,205,0.35) 55%, transparent 75%);
  filter: blur(6px);
}
.s1-name {
  position: relative;
  font-size: clamp(64px, 14.5vw, 230px);
  font-weight: 800; letter-spacing: -0.045em; line-height: 0.94;
  color: #fff6ea;
  text-shadow: 0 4px 24px rgba(217,133,74,0.30), 0 18px 70px rgba(190,105,50,0.28);
  white-space: nowrap;
}
.s1-sub {
  position: relative;
  margin-top: 22px;
  font-family: var(--font-mono); font-size: clamp(9px, 1.15vw, 12.5px);
  letter-spacing: 0.3em; text-transform: uppercase;
  color: #9a6438;
}
.s1-scroll {
  position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em;
  text-transform: uppercase; color: #a86e42;
}
.s1-scroll::after {
  content: ''; width: 1px; height: 34px;
  background: linear-gradient(to bottom, #a86e42, transparent);
}
html.motion .s1-scroll { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,7px); } }

@media (max-width: 760px) {
  .s1-name { font-size: clamp(48px, 16.5vw, 110px); }
  .s1-sub { letter-spacing: 0.18em; padding: 0 18px; line-height: 1.8; }
}

/* ════════ SCENE 2: STATEMENT ════════ */
#s2 { background: var(--cream); }
.s2-pin {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
}
.s2-kicker { margin-bottom: 28px; }
.statement {
  font-size: clamp(38px, 6.2vw, 96px);
  font-weight: 800; letter-spacing: -0.035em; line-height: 1.08;
  max-width: 16ch;
  color: var(--ink);
}
.statement em { font-style: normal; color: var(--peach-deep); }
/* word spans (built by splitStatement) */
.statement .w { color: inherit; }
html[data-lang="zh"] .statement { letter-spacing: 0.01em; max-width: 15ch; }

@media (max-width: 760px) {
  .statement { font-size: clamp(34px, 9.5vw, 54px); }
}

/* ════════ RESPONSIVE NAV ════════ */
@media (max-width: 760px) {
  nav { padding: 14px 14px; }
  .nav-center .pill-link { display: none; } /* keep logo only */
  .pill { padding: 9px 14px; font-size: 12.5px; }
}
</style>
</head>

<body>

<div class="vignette"></div>
<div class="grain"></div>

<!-- NAV -->
<nav>
  <a class="pill pill-sm" href="mailto:teemow0106@163.com" data-i18n="nav_email">Email</a>
  <div class="nav-center">
    <a class="pill pill-link" href="#why" data-i18n="nav_about">About</a>
    <a class="pill pill-logo" href="#top" aria-label="Top">tw</a>

  </div>

<main id="top">

  <!-- SCENE 1: OPENING -->
  <section class="scene" id="s1">
    <div class="s1-stage">
      <div class="s1-halo"></div>

<!-- GitHub modal: ported in Task 8 -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js" defer></script>

<script>
// ════════ I18N ════════
const i18n = {
  en: {
    nav_email: 'Email', nav_about: 'About', nav_work: 'Work',
    s1_sub: 'Strategy × Product × AI — Imperial College London',
    s1_scroll: 'scroll',
    s2_kicker: 'Strategy · Product · AI',
    s2_statement: 'I turn <em>strategy</em> into products people <em>love</em>:',
  },
  zh: {
    nav_email: '邮箱', nav_about: '关于', nav_work: '作品',
    s1_sub: '战略 × 产品 × AI — 伦敦帝国理工学院',
    s1_scroll: '向下滚动',
    s2_kicker: '战略 · 产品 · AI',
    s2_statement: '我把<em>战略</em>，做成<em>被人喜爱的产品</em>：',
  }
};

let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-zh').classList.toggle('active', lang === 'zh');
  const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
  localStorage.setItem('tw-lang', lang);
  document.dispatchEvent(new CustomEvent('langchange'));
}

// ════════ MOTION GATE (progressive enhancement) ════════
let motionOK = false;
let lenis = null;

window.addEventListener('DOMContentLoaded', () => {
  setLang(localStorage.getItem('tw-lang') || 'en');

  motionOK = matchMedia('(prefers-reduced-motion: no-preference)').matches
    && !!window.gsap && !!window.ScrollTrigger && !!window.Lenis;

  if (motionOK) {
    document.documentElement.classList.add('motion');
    gsap.registerPlugin(ScrollTrigger);
    lenis = new Lenis();
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
    initScenes();
  }

  // smooth anchor links (Lenis or native fallback)
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const target = document.querySelector(a.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      if (lenis) lenis.scrollTo(target, { offset: 0 }); else target.scrollIntoView({ behavior: 'smooth' });
    });
  });
});

// ════════ SCENES (populated per task) ════════
function initScenes() {
  initS1();
  initS2();
}

// Scene 1: load-in rise, then name shrinks & lifts away on scroll
function initS1() {
  gsap.from('.s1-name', { y: 90, opacity: 0, duration: 1.4, ease: 'power3.out', delay: 0.15 });
  gsap.from('.s1-sub', { y: 30, opacity: 0, duration: 1.1, ease: 'power3.out', delay: 0.55 });
  gsap.from('nav .pill, nav .lang-pill', { y: -26, opacity: 0, duration: 0.9, stagger: 0.06, ease: 'power3.out', delay: 0.8 });

  gsap.to('.s1-stage', {
    scale: 0.82, y: -60, opacity: 0, transformOrigin: '50% 100%', ease: 'none',
    scrollTrigger: { trigger: '#s1', start: 'bottom 92%', end: 'bottom 30%', scrub: 0.4 }
  });
}

// Scene 2: statement words light up under a pinned scrub
let s2tl = null;
function initS2() {
  document.getElementById('s2').style.height = '260vh';
  buildStatement();
  document.addEventListener('langchange', buildStatement);
}

function buildStatement() {
  if (!motionOK) return; // static page keeps plain <em> highlighting
  const el = document.querySelector('.statement');
  if (!el) return;
  const frag = document.createDocumentFragment();
  [...el.childNodes].forEach(node => {
    const hl = node.nodeName === 'EM';
    const text = node.textContent;
    const tokens = /[一-鿿]/.test(text) ? [...text] : text.split(/(?<= )/);
    tokens.forEach(tk => {
      if (!tk) return;
      const s = document.createElement('span');
      s.className = 'w' + (hl ? ' hl' : '');
      s.textContent = tk;
      frag.appendChild(s);
    });
  });
  el.replaceChildren(frag);

  if (s2tl) { if (s2tl.scrollTrigger) s2tl.scrollTrigger.kill(); s2tl.kill(); s2tl = null; }
  const spans = el.querySelectorAll('.w');
  gsap.set(spans, { color: '#ddccb4' });
  s2tl = gsap.timeline({
    scrollTrigger: { trigger: '#s2', start: 'top top', end: 'bottom bottom', scrub: 0.35, pin: '.s2-pin' }
  });
  spans.forEach((s, i) => {
    s2tl.to(s, {
      color: s.classList.contains('hl') ? '#d9854a' : '#3e3228',
      duration: 0.5, ease: 'none'
    }, i * 0.14);
  });
  ScrollTrigger.refresh();
}
</script>

</body>
